name: VaultFlow
options:
  bundleIdPrefix: com.deepak.portfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  VaultFlow:
    type: application
    platform: iOS
    sources:
      - path: VaultFlow
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.deepak.portfolio.vaultflow
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock VaultFlow with Face ID
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - VaultFlowTests
  VaultFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VaultFlowTests
    dependencies:
      - target: VaultFlow
